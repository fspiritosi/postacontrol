version: '3'

vars:
  APP_NAME: "postacontrol"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  check:
    summary: Verificación completa (Go + frontend)
    cmds:
      # genera frontend/dist (lo embebe main.go) y los bindings
      - task: common:build:frontend
      # Patrones acotados: ./... recorre build/ y frontend/node_modules.
      - go vet . ./app/... ./core/...
      - go test . ./app/... ./core/...
      - task: check:frontend

  check:frontend:
    summary: Verificación del frontend (tipos, tests, lint)
    dir: frontend
    cmds:
      - npx tsc --noEmit
      - npx vitest run --passWithNoTests
      - npx eslint .

  install:desktop:
    desc: Instala la app en ~/.local (binario, íconos y lanzador) para usarla a diario
    cmds:
      - task: build
      - mkdir -p "$HOME/.local/bin" "$HOME/.local/share/applications"
      - cp {{.BIN_DIR}}/{{.APP_NAME}} "$HOME/.local/bin/{{.APP_NAME}}"
      - |
        for d in build/brand/native/linux/hicolor/*/apps; do
          size=$(basename "$(dirname "$d")")
          mkdir -p "$HOME/.local/share/icons/hicolor/$size/apps"
          cp "$d/codecontrol-mail.png" "$HOME/.local/share/icons/hicolor/$size/apps/postacontrol.png"
        done
      - |
        cat > "$HOME/.local/share/applications/ar.com.codecontrol.postacontrol.desktop" <<EOF
        [Desktop Entry]
        Type=Application
        Name=PostaControl
        Comment=Cliente de correo
        Exec="$HOME/.local/bin/{{.APP_NAME}}"
        Icon=postacontrol
        Categories=Network;Email;
        Keywords=correo;mail;email;
        StartupWMClass=ar.com.codecontrol.postacontrol
        Terminal=false
        EOF
      - gtk-update-icon-cache -f -t "$HOME/.local/share/icons/hicolor" || true
      - update-desktop-database "$HOME/.local/share/applications" || true

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
